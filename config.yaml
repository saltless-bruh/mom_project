# Mom's Accounting Automation System (MAAS) Configuration

app:
  name: "MAAS"
  version: "1.0.0"
  environment: "production"
  debug: false
  log_level: "INFO"

server:
  host: "127.0.0.1"
  port: 8765
  workers: 1

gemini:
  api_key_env: "GEMINI_API_KEY"
  model: "gemini-2.0-flash"
  temperature: 0.1
  max_output_tokens: 8192
  timeout_seconds: 30
  retry_attempts: 3

database:
  path: "data/maas.db"
  backup_path: "data/backups/"
  backup_retention_days: 7

storage:
  upload_path: "data/uploads/"
  archive_path: "data/archive/"
  reports_path: "data/reports/"
  screenshots_path: "data/screenshots/"
  allowed_extensions: [".pdf"]

acsoft:
  window_title: "ACSoft"
  executable_path: "C:\\Program Files\\ACSoft\\ACSoft.exe"
  connection_timeout_seconds: 30
  action_delay_ms: 500
  screenshot_before_action: true
  auto_save: false # SAFETY: NEVER AUTO SAVE

automation:
  global_kill_switch_key: "f12"
  dry_run: true
  visual_delay: 1.0 # Seconds to pause/highlight (Traffic Light feature)
