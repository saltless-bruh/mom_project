[pytest]
# pytest configuration file

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 7.0

# Add current directory to Python path
pythonpath = .

# Output options
addopts =
    # Verbose output
    -v
    
    # Show local variables in tracebacks
    -l
    
    # Show summary of all test outcomes
    -ra
    
    # Strict markers (fail on unknown markers)
    --strict-markers
    
    # Coverage options
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80
    
    # Show warnings
    -W default
    
    # Fail on first failure (optional, uncomment if needed)
    # -x
    
    # Show test durations (slowest 10)
    --durations=10
    
    # Asyncio mode
    --asyncio-mode=auto

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, multiple components)
    e2e: End-to-end tests (slowest, full workflow)
    slow: Tests that take a long time to run
    db: Tests that require database
    api: Tests that test API endpoints
    gemini: Tests that involve Gemini API (mocked or real)
    acsoft: Tests that involve ACSoft automation
    performance: Performance/benchmark tests
    
# Coverage options
[coverage:run]
source = app
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */env/*
    */site-packages/*

[coverage:report]
# Fail if coverage is below threshold
fail_under = 80

# Show missing lines
show_missing = true

# Exclude lines from coverage
exclude_lines =
    # Standard pragma
    pragma: no cover
    
    # Don't complain about missing debug code
    def __repr__
    
    # Don't complain if tests don't hit defensive assertion code
    raise AssertionError
    raise NotImplementedError
    
    # Don't complain if non-runnable code isn't run
    if __name__ == .__main__.:
    
    # Don't complain about abstract methods
    @abstractmethod
    
    # Type checking blocks
    if TYPE_CHECKING:
    
    # Defensive programming
    if False:

[coverage:html]
directory = htmlcov
